name: Codex CI Autofix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Same-repository pull request number to repair."
        required: true
        type: string
      failed_run_id:
        description: "Failed CI run id. Defaults to the latest failed CI run for the PR."
        required: false
        type: string
# All Codex CI autofix executions are fail-closed patch-only artifact runs.
permissions: {}

concurrency:
  group: codex-ci-autofix-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare guarded context
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.context.outputs.should_run }}
      reason: ${{ steps.context.outputs.reason }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      base_branch: ${{ steps.context.outputs.base_branch }}
      head_branch: ${{ steps.context.outputs.head_branch }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      failed_run_id: ${{ steps.context.outputs.failed_run_id }}
      mode: ${{ steps.context.outputs.mode }}
    steps:
      - name: Resolve pull request and failed run
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = `${owner}/${repo}`;
            const set = (name, value) => core.setOutput(name, String(value ?? ""));
            const stop = (reason) => {
              set("should_run", "false");
              set("reason", reason);
              core.notice(reason);
            };

            let prNumber;
            let failedRunId;
            let mode = "patch-only";

            if (context.eventName === "workflow_run") {
              const run = context.payload.workflow_run;

              if (run.conclusion !== "failure") {
                return stop(`CI conclusion is ${run.conclusion}; autofix only runs on failure.`);
              }
              if (run.event !== "pull_request") {
                return stop(`CI event is ${run.event}; autofix only runs for pull_request CI.`);
              }
              if (!run.pull_requests || run.pull_requests.length === 0) {
                return stop("Failed CI run is not associated with a pull request.");
              }
              if (!run.head_repository || run.head_repository.full_name !== repository) {
                return stop("Pull request branch is from a fork or another repository; write-token autofix is disabled.");
              }

              prNumber = run.pull_requests[0].number;
              failedRunId = run.id;
            } else {
              prNumber = Number(core.getInput("pr_number"));
              failedRunId = core.getInput("failed_run_id");

              if (!Number.isInteger(prNumber) || prNumber <= 0) {
                return stop("workflow_dispatch requires a valid pr_number.");
              }
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.head.repo.full_name !== repository) {
              return stop("Pull request branch is from a fork or another repository; write-token autofix is disabled.");
            }

            if (!failedRunId) {
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                event: "pull_request",
                branch: pr.head.ref,
                status: "completed",
                per_page: 30,
              });
              const failed = runs.workflow_runs.find((run) =>
                run.name === "CI" &&
                run.conclusion === "failure" &&
                run.head_sha === pr.head.sha
              );
              if (!failed) {
                return stop("No failed CI workflow_run was found for the current PR head.");
              }
              failedRunId = failed.id;
            }

            set("should_run", "true");
            set("reason", "ready");
            set("pr_number", pr.number);
            set("base_branch", pr.base.ref);
            set("head_branch", pr.head.ref);
            set("head_sha", pr.head.sha);
            set("failed_run_id", failedRunId);
            set("mode", mode);

  generate-fix:
    name: Generate patch with Codex
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      has_patch: ${{ steps.diff.outputs.has_patch }}
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        run: git fetch --no-tags origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
        env:
          BASE_BRANCH: ${{ needs.prepare.outputs.base_branch }}

      - name: Verify clean worktree before dependency setup
        run: |
          set -eu
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "checkout is not clean before dependency setup" >&2
            git status --short >&2
            exit 1
          fi

      - name: Set up Python
        if: hashFiles('pyproject.toml', 'requirements.txt', 'uv.lock') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies when declared
        if: hashFiles('pyproject.toml', 'requirements.txt', 'uv.lock') != ''
        run: |
          set -eu
          if [ -f uv.lock ]; then
            python -m pip install --upgrade uv
            UV_CACHE_DIR=.uv-cache uv sync
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]" || python -m pip install -e .
          fi

      - name: Install Node dependencies when declared
        if: hashFiles('package.json') != ''
        run: |
          set -eu
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          fi

      - name: Reject dependency setup mutations
        run: |
          set -eu
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            exit 0
          fi
          echo "dependency setup changed tracked, staged, or non-ignored untracked paths" >&2
          git status --short --untracked-files=all >&2
          exit 1

      - name: Reject pull request prompt changes
        run: |
          set -eu
          if ! git diff --quiet "origin/${BASE_BRANCH}...HEAD" -- .github/codex/prompts/ci-autofix.md; then
            echo "Pull request changes to the CI autofix prompt are not trusted for Codex execution." >&2
            exit 1
          fi
        env:
          BASE_BRANCH: ${{ needs.prepare.outputs.base_branch }}

      - name: Render Codex prompt
        run: |
          set -eu
          git show "origin/${BASE_BRANCH}:.github/codex/prompts/ci-autofix.md" > "$RUNNER_TEMP/codex-ci-autofix-prompt.md"
          {
            echo
            echo "Runtime context:"
            echo
            echo "- Failed CI run id: ${FAILED_RUN_ID}"
            echo "- Pull request number: ${PR_NUMBER}"
            echo "- Base branch: ${BASE_BRANCH}"
            echo "- Head branch: ${HEAD_BRANCH}"
            echo "- Head SHA: ${HEAD_SHA}"
            echo
            echo "Use these environment variables when running commands:"
            echo
            echo "- FAILED_RUN_ID"
            echo "- PR_NUMBER"
            echo "- BASE_BRANCH"
            echo "- HEAD_BRANCH"
            echo "- HEAD_SHA"
          } >> "$RUNNER_TEMP/codex-ci-autofix-prompt.md"
        env:
          FAILED_RUN_ID: ${{ needs.prepare.outputs.failed_run_id }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          BASE_BRANCH: ${{ needs.prepare.outputs.base_branch }}
          HEAD_BRANCH: ${{ needs.prepare.outputs.head_branch }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ needs.prepare.outputs.failed_run_id }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          BASE_BRANCH: ${{ needs.prepare.outputs.base_branch }}
          HEAD_BRANCH: ${{ needs.prepare.outputs.head_branch }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/codex-ci-autofix-prompt.md
          output-file: ${{ runner.temp }}/codex-ci-autofix-output.md
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Create patch artifact
        id: diff
        run: |
          set -eu
          git add -N .
          git diff --binary HEAD > "$RUNNER_TEMP/codex-ci-autofix.patch"
          if [ -s "$RUNNER_TEMP/codex-ci-autofix.patch" ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated patch boundaries
        if: steps.diff.outputs.has_patch == 'true'
        run: |
          set -eu
          git diff --check HEAD
          python3 template/.project-agent-workflow/scripts/security-static-check.py --changed
          protected=$(git diff --name-only HEAD | grep -E '^(\.github/workflows/|\.github/codex/|\.env($|\.)|.*production.*|.*deploy.*)' || true)
          if [ -n "$protected" ]; then
            echo "Codex patch touched protected paths:" >&2
            echo "$protected" >&2
            exit 1
          fi
          deleted_tests=$(git diff --diff-filter=D --name-only HEAD -- tests || true)
          if [ -n "$deleted_tests" ]; then
            echo "Codex patch deleted tests:" >&2
            echo "$deleted_tests" >&2
            exit 1
          fi

      - name: Upload patch artifact
        if: steps.diff.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-ci-autofix-patch-${{ needs.prepare.outputs.pr_number }}
          path: ${{ runner.temp }}/codex-ci-autofix.patch
          if-no-files-found: error

      - name: Upload Codex summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-ci-autofix-summary-${{ needs.prepare.outputs.pr_number }}
          path: ${{ runner.temp }}/codex-ci-autofix-output.md
          if-no-files-found: ignore
