name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: UV_CACHE_DIR=.uv-cache uv sync --python "$(command -v python3)"

      - name: Use the synced environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install pinned actionlint
        run: |
          scripts/install-actionlint.sh "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Check Copier
        run: UV_CACHE_DIR=.uv-cache uv run copier --version

      - name: Check plan completion
        run: sh scripts/check-agent-completion.sh --plans-only

      - name: Lint package structure
        run: scripts/lint-project-workflow.sh

      - name: Smoke test generated projects
        run: tests/smoke.sh
        env:
          REQUIRE_ACTIONLINT: "1"
          REQUIRE_COPIER: "1"

      - name: Validate YAML and GitHub Actions
        run: |
          UV_CACHE_DIR=.uv-cache uv run python scripts/check-yaml.py .
          REQUIRE_ACTIONLINT=1 scripts/lint-github-actions.sh .

      - name: Test generated hooks
        run: tests/test-hooks.py

      - name: Test Copier update flow
        run: tests/copier-update.sh
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.autoDetach
          GIT_CONFIG_VALUE_0: "false"
          REQUIRE_COPIER: "1"

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --check "$BASE_SHA...$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = push ] &&
            [ "$REF_TYPE" = tag ] &&
            git cat-file -e "$HEAD_SHA^" 2>/dev/null; then
            git diff --check "$HEAD_SHA^..$HEAD_SHA"
          elif [ "$EVENT_NAME" = push ] &&
            [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ] &&
            git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA..$HEAD_SHA"
          else
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            git diff --check "$EMPTY_TREE" "$HEAD_SHA"
          fi

  copier-fixture-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the Copier fixture contract
        run: python3 tests/test-copier-fixture-validator.py

  plan-restructure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test plan restructuring
        run: python3 tests/test-plan-restructure.py

  plan-execution-state:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test plan execution state
        run: python3 tests/test-plan-execution-state.py

  sandboxed-plan-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and probe bubblewrap
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          probe() {
            bwrap --unshare-all --share-net --unshare-user --new-session \
              --disable-userns --cap-drop ALL --die-with-parent --clearenv \
              --ro-bind / / --proc /proc --dev /dev -- /bin/true
          }
          if ! probe; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            probe
          fi

      - name: Test the sandboxed plan worker
        run: python3 tests/test-sandboxed-plan-worker.py

  minimum-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up minimum Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies on the minimum interpreter
        run: UV_CACHE_DIR=.uv-cache uv sync --python "$(command -v python3)"

      - name: Use the synced environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Test declared minimum Copier and Python
        run: tests/copier-minimum.sh
        env:
          REQUIRE_MINIMUM_COMPAT: "1"
