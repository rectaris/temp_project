name: Project agent workflow

on:
  pull_request:
    paths:
      - ".project-agent-workflow/**"
      - ".agents/skills/**"
      - ".codex/**"
      - "docs/agent/**"
      - "docs/plan/**"
      - "AGENTS.md"
      - ".github/workflows/project-agent-workflow.yml"
  push:
    branches:
      - main
    paths:
      - ".project-agent-workflow/**"
      - ".agents/skills/**"
      - ".codex/**"
      - "docs/agent/**"
      - "docs/plan/**"
      - "AGENTS.md"
      - ".github/workflows/project-agent-workflow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --check "$BASE_SHA...$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = push ] &&
            [ "$REF_TYPE" = tag ] &&
            git cat-file -e "$HEAD_SHA^" 2>/dev/null; then
            git diff --check "$HEAD_SHA^..$HEAD_SHA"
          elif [ "$EVENT_NAME" = push ] &&
            [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ] &&
            git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA..$HEAD_SHA"
          else
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            git diff --check "$EMPTY_TREE" "$HEAD_SHA"
          fi

      - name: Validate project agent workflow
        run: |
          set -eu
          python3 .project-agent-workflow/scripts/lint-plan-docs.py
          python3 .project-agent-workflow/scripts/format-plan-docs.py --check
          python3 .project-agent-workflow/scripts/check-codex-toml.py
          python3 .project-agent-workflow/scripts/structure-map.py --check
          python3 .project-agent-workflow/scripts/security-static-check.py --managed
